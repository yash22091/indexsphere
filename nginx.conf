events {
  worker_connections 1024;
}

http {
  # Timeouts — important for SSE (monitoring stream stays open)
  proxy_read_timeout  3600s;
  proxy_send_timeout  3600s;
  proxy_connect_timeout 60s;
  send_timeout        3600s;

  # Use Docker's embedded DNS so nginx re-resolves upstream on each connection.
  # This prevents stale-IP 502 errors when the app container is restarted.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Compression
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

  # Security headers are set by the Next.js app (HSTS, X-Frame-Options,
  # X-Content-Type-Options, Referrer-Policy). Nginx adds no duplicates.

  # HTTP → HTTPS redirect
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Modern TLS only
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';

    # HSTS (6 months)
    # HSTS is set by the app itself (Next.js: max-age=63072000; includeSubDomains; preload)
    # Duplicate here omitted to avoid conflicting headers

    # SSE endpoint — disable buffering so events reach the browser immediately
    location /api/monitoring/stream {
      set $upstream http://indexsphere:3000;
      proxy_pass $upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_buffering off;
      proxy_cache off;
      chunked_transfer_encoding on;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    location / {
      set $upstream http://indexsphere:3000;
      proxy_pass $upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_cache_bypass $http_upgrade;
    }
  }
}

